name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build Carubbi.AudioConverter.slnx -c Release

      - name: Test
        run: dotnet run --project Carubbi.AudioConverter.Api.Tests -c Release --no-build
